<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ecdf" />
    <title>سفارش کاشی</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" dir="rtl">
      <header class="top">
        <p class="eyebrow">نمایشگاه کاشی</p>
        <h1>سفارش با حرف</h1>
        <ol class="steps" id="steps" aria-label="مراحل سفارش">
          <li data-step="say">گفتن</li>
          <li data-step="samples">نمونه‌ها</li>
          <li data-step="summary">خلاصه</li>
        </ol>
      </header>
      <div id="live" class="sr" aria-live="polite"></div>
      <div id="view"></div>
      <noscript>
        <p>برای این صفحه جاوااسکریپت لازم است.</p>
      </noscript>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
